<div>
    <ng-container *ngFor="let task of tasks; trackBy: trackById">
        <div cdkDrag [cdkDragData]="task">
            <app-task-item [task]="task" (edit)="editTask(task)"
                (requestDelete)="confirmDelete(task.id)"></app-task-item>
        </div>
    </ng-container>

@if (tasks.length === 0) {
    <p>No tasks found</p>
  }
</div>
